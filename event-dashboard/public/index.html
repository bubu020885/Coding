<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand">Event&nbsp;Dashboard</h1>
      <div class="topbar-right">
        <span id="status-dot" class="status-dot" title="Verbindungsstatus"></span>
        <span id="last-updated" class="last-updated">–</span>
        <span id="clock" class="clock">--:--:--</span>
      </div>
    </header>

    <main class="columns" id="columns">
      <!-- Spalten werden per JS befüllt -->
    </main>
  </div>

  <template id="column-template">
    <section class="column">
      <div class="column-header">
        <div class="weekday"></div>
        <div class="date"></div>
      </div>
      <div class="event-list"></div>
    </section>
  </template>

  <template id="event-template">
    <article class="event-card">
      <div class="event-time"></div>
      <div class="event-main">
        <div class="event-name"></div>
        <div class="event-location"></div>
        <div class="event-notes"></div>
      </div>
      <div class="event-participants">
        <span class="participants-icon">&#128101;</span>
        <span class="participants-count"></span>
      </div>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
