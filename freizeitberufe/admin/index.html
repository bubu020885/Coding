<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – FreizeitKarriere</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🎡</div>
      <div class="login-title">FreizeitKarriere</div>
      <div class="login-sub">CMS-Administration · Bitte anmelden</div>
    </div>

    <div id="alert" style="display:none"></div>

    <form class="login-form" id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="username">Benutzername <span class="required">*</span></label>
        <input id="username" name="username" type="text" class="form-control"
          placeholder="Benutzername eingeben" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Passwort <span class="required">*</span></label>
        <div style="position:relative">
          <input id="password" name="password" type="password" class="form-control"
            placeholder="Passwort eingeben" autocomplete="current-password" required style="padding-right:42px">
          <button type="button" id="toggle-pw" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light);font-size:0.9rem">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary login-btn" id="login-btn">
        Anmelden
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.78rem;color:var(--text-light)">
      FreizeitKarriere CMS · Nur für Administratoren
    </p>
  </div>
</div>

<script>
const API = 'http://localhost:3001/api';

// Redirect if already logged in
fetch(`${API}/auth/check`, { credentials: 'include' })
  .then(r => r.json())
  .then(d => { if (d.authenticated) window.location.href = '/admin/dashboard.html'; })
  .catch(() => {});

// Toggle password visibility
document.getElementById('toggle-pw').addEventListener('click', function() {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
  this.textContent = pw.type === 'password' ? '👁' : '🙈';
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn   = document.getElementById('login-btn');
  const alert = document.getElementById('alert');
  btn.textContent = 'Anmelden …';
  btn.disabled = true;
  alert.style.display = 'none';

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      window.location.href = '/admin/dashboard.html';
    } else {
      alert.className = 'alert alert-error';
      alert.textContent = '❌ ' + (data.error || 'Anmeldung fehlgeschlagen');
      alert.style.display = 'flex';
      btn.textContent = 'Anmelden';
      btn.disabled = false;
    }
  } catch {
    alert.className = 'alert alert-error';
    alert.textContent = '❌ Server nicht erreichbar. Bitte Backend starten (node server.js).';
    alert.style.display = 'flex';
    btn.textContent = 'Anmelden';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
