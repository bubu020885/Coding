<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – FreizeitKarriere</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 50%, var(--teal) 100%);
      position: relative;
      overflow: hidden;
    }

    .login-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 80% 20%, rgba(244,169,64,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 10% 80%, rgba(232,101,74,0.12) 0%, transparent 55%);
    }

    /* Decorative shapes */
    .login-shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      pointer-events: none;
    }

    .login-card {
      background: #fff;
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.28);
      position: relative;
      z-index: 1;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--coral), var(--gold));
      font-size: 2.2rem;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(232,101,74,0.3);
    }

    .login-logo h1 {
      font-size: 1.5rem;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .login-logo p {
      font-size: 0.88rem;
      color: var(--text-light);
      max-width: none;
    }

    .login-divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .login-field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-mid);
    }

    .login-input-wrap {
      position: relative;
    }

    .login-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--text-dark);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .login-input:focus {
      border-color: var(--teal);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(45,125,154,0.12);
    }

    .login-input.has-toggle {
      padding-right: 44px;
    }

    .pw-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-light);
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--text-dark); }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--coral), var(--coral-light));
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: var(--font-sans);
      border: none;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(232,101,74,0.35);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232,101,74,0.4);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .login-alert {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .login-alert.error {
      background: #FFF0EE;
      color: #C0392B;
      border: 1.5px solid rgba(192,57,43,0.2);
    }

    .login-alert.success {
      background: #E8F8F0;
      color: #1A7A52;
      border: 1.5px solid rgba(39,169,106,0.25);
    }

    .login-back {
      text-align: center;
      margin-top: 24px;
    }

    .login-back a {
      font-size: 0.85rem;
      color: var(--text-light);
      text-decoration: none;
      transition: color 0.2s;
    }

    .login-back a:hover { color: var(--teal); }
  </style>
</head>
<body>

<!-- Navigation (minimal) -->
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">🎡</div>
      Freizeit<span>Karriere</span>
    </a>
    <div class="nav-links">
      <a href="berufe.html">Berufe</a>
      <a href="ausbildung.html">Ausbildung</a>
      <a href="geschichten.html">Geschichten</a>
      <a href="branche.html">Branche</a>
      <a href="jobboerse.html" class="nav-cta">Jobbörse</a>
    </div>
    <button class="nav-mobile-toggle">☰</button>
  </div>
</nav>
<div class="nav-mobile">
  <button class="nav-mobile-close">✕</button>
  <a href="berufe.html">Berufe</a>
  <a href="ausbildung.html">Ausbildung</a>
  <a href="geschichten.html">Geschichten</a>
  <a href="branche.html">Branche</a>
  <a href="jobboerse.html">Jobbörse</a>
</div>

<!-- Login Area -->
<div class="login-page">
  <!-- Decorative background shapes -->
  <div class="login-shape" style="width:500px;height:500px;top:-180px;right:-120px"></div>
  <div class="login-shape" style="width:300px;height:300px;bottom:-100px;left:-80px"></div>
  <div class="login-shape" style="width:160px;height:160px;top:30%;right:15%;background:rgba(244,169,64,0.05)"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-badge">🎡</div>
      <h1>FreizeitKarriere</h1>
      <p>Administration · Bitte melde dich an</p>
    </div>

    <div class="login-divider"></div>

    <div id="login-alert" class="login-alert"></div>

    <form id="login-form" autocomplete="on">
      <div class="login-field">
        <label for="username">Benutzername</label>
        <input
          id="username"
          type="text"
          class="login-input"
          placeholder="Benutzername eingeben"
          autocomplete="username"
          required
        >
      </div>

      <div class="login-field">
        <label for="password">Passwort</label>
        <div class="login-input-wrap">
          <input
            id="password"
            type="password"
            class="login-input has-toggle"
            placeholder="Passwort eingeben"
            autocomplete="current-password"
            required
          >
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Passwort anzeigen">👁</button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <span id="btn-text">Anmelden</span>
      </button>
    </form>

    <div class="login-back">
      <a href="index.html">← Zurück zur Website</a>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const API = 'http://localhost:3001/api';

  // Redirect if already authenticated
  fetch(`${API}/auth/check`, { credentials: 'include' })
    .then(r => r.json())
    .then(d => { if (d.authenticated) window.location.href = '/admin/dashboard.html'; })
    .catch(() => {});

  // Password toggle
  document.getElementById('pw-toggle').addEventListener('click', function () {
    const pw = document.getElementById('password');
    const isHidden = pw.type === 'password';
    pw.type = isHidden ? 'text' : 'password';
    this.textContent = isHidden ? '🙈' : '👁';
  });

  // Login form submit
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn     = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const alert   = document.getElementById('login-alert');

    btn.disabled  = true;
    btnText.textContent = 'Anmelden …';
    alert.style.display = 'none';

    try {
      const res  = await fetch(`${API}/auth/login`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        alert.className = 'login-alert success';
        alert.innerHTML = '✅ Anmeldung erfolgreich – Weiterleitung …';
        alert.style.display = 'flex';
        setTimeout(() => { window.location.href = '/admin/dashboard.html'; }, 600);
      } else {
        showError(data.error || 'Ungültige Anmeldedaten');
      }
    } catch {
      showError('Server nicht erreichbar. Bitte Backend starten:<br><code>cd backend && node server.js</code>');
    }
  });

  function showError(msg) {
    const alert = document.getElementById('login-alert');
    alert.className = 'login-alert error';
    alert.innerHTML = '❌ ' + msg;
    alert.style.display = 'flex';
    const btn = document.getElementById('login-btn');
    btn.disabled = false;
    document.getElementById('btn-text').textContent = 'Erneut versuchen';
    // Shake animation
    btn.style.animation = 'none';
    document.getElementById('login-form').style.animation = 'shake 0.4s ease';
    setTimeout(() => document.getElementById('login-form').style.animation = '', 400);
  }
</script>

<style>
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%,60%{transform:translateX(-6px)}
    40%,80%{transform:translateX(6px)}
  }
</style>
</body>
</html>
